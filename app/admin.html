<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>window.disableLaunchReport = true;</script>
<script src="report.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0e17;
  --card: #151a27;
  --border: rgba(255, 255, 255, 0.1);
  --text: #eef0fb;
  --muted: #9aa0b8;
  --grad: linear-gradient(135deg, #e5485f, #c2263e);
  --ok: #4ade80;
  --bad: #f87171;
  --warn: #f2808f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px rgba(0, 0, 0, 0.4);
}

html, body { min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Arial, sans-serif;
  background:
    radial-gradient(1100px 480px at 85% -10%, rgba(229, 72, 95, 0.15), transparent 60%),
    radial-gradient(900px 420px at -10% 0%, rgba(194, 38, 62, 0.13), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px 32px;
}

h1 {
  font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin: 8px 0 4px;
  text-align: center;
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sub { color: var(--muted); font-size: 15px; margin-bottom: 18px; text-align: center; }
.section-title {
  font-size: 13px; font-weight: 700; letter-spacing: .08em;
  color: var(--muted); margin: 16px 0 8px; text-transform: uppercase;
}

.ticket-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 24px 0;
}
.ticket-btn {
  width: 100%;
  text-align: left;
  padding: 15px 16px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.ticket-btn:hover {
  border-color: rgba(229, 72, 95, 0.6);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  transform: translateY(-1px);
}
.ticket-btn:active { transform: scale(0.975); }
.ticket-btn.active { border-color: #e5485f; background: rgba(229, 72, 95, 0.12); }
.ticket-num { font-weight: 700; }
.ticket-count {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--grad);
  box-shadow: 0 4px 14px rgba(194, 38, 62, 0.4);
}

.ticket-bar-title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.quiz-bar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  padding: 12px 0 8px;
  margin-top: 12px;
  background: linear-gradient(180deg, rgba(11, 14, 23, 0), var(--bg) 45%);
}
.quiz-bar-top { display: flex; align-items: center; gap: 12px; }
.btn-back {
  width: 42px; height: 42px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--card); box-shadow: var(--shadow); cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.btn-back:hover { background: #232741; }
.btn-back:active { transform: scale(0.94); }

button.btn {
  min-width: 46px; padding: 10px 6px; font-size: 15px; font-weight: 600;
  color: var(--text);
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--card); cursor: pointer;
}
button.btn:hover { background: #232741; }
button.btn.active { background: var(--grad); border-color: transparent; color: #fff; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 18px; margin-top: 14px;
}
.card.has-c { border-color: rgba(229, 72, 95, 0.6); }
.card-head {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-bottom: 12px;
}
.card-head .tag {
  font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: 0;
  color: #f2808f; background: rgba(229, 72, 95, 0.14);
  border-radius: 8px; padding: 2px 8px;
}
.card-img {
  display: block; max-width: 100%; max-height: 240px; margin: 0 auto 14px;
  border: 1px solid var(--border); border-radius: 12px; background: #11131f;
}
.card-img.hidden { display: none; }
.q-text { font-size: 15px; line-height: 1.45; color: var(--text); margin-bottom: 12px; }
.answers { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.ans {
  padding: 9px 12px; border-radius: 12px;
  font-size: 14px; line-height: 1.4; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); color: var(--muted);
}
.ans-correct {
  background: linear-gradient(135deg, #14532d, #166534);
  border-color: rgba(74, 222, 128, 0.5); color: #bbf7d0; font-weight: 600;
}
.ans-wrong {
  background: linear-gradient(135deg, #4c0519, #7f1d3a);
  border-color: rgba(251, 113, 133, 0.5); color: #fecaca; font-weight: 600;
}
.ans .mark { font-weight: 700; }
.add-comment {
  margin-bottom: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700;
  border: 1px dashed #e5485f; border-radius: 10px;
  background: rgba(229, 72, 95, 0.12); color: #f2808f; cursor: pointer;
}
.add-comment:hover { background: rgba(229, 72, 95, 0.2); }
.editor[hidden] { display: none; }
textarea {
  width: 100%; min-height: 80px; padding: 12px; font: inherit; font-size: 14px; line-height: 1.45;
  color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; resize: vertical;
  background: rgba(255, 255, 255, 0.04);
}
textarea:focus { outline: 2px solid rgba(229, 72, 95, 0.8); outline-offset: 1px; }
button.save {
  margin-top: 10px; padding: 10px 22px; font-size: 15px; font-weight: 700;
  border: none; border-radius: 12px;
  color: #fff; background: var(--grad);
  box-shadow: 0 6px 18px rgba(194, 38, 62, 0.4); cursor: pointer;
  transition: transform 0.1s, filter 0.15s;
}
button.save:hover { filter: brightness(1.08); }
button.save:disabled { background: #3a3f52; box-shadow: none; color: #9aa0b8; cursor: default; }
button.del {
  margin-top: 10px; margin-left: 8px; padding: 10px 16px; font-size: 15px; font-weight: 600;
  border: 1px solid rgba(248, 113, 113, 0.5); border-radius: 12px;
  color: #fca5a5; background: transparent; cursor: pointer;
}
button.del:hover { background: rgba(248, 113, 113, 0.12); }
button.del.hidden { display: none; }
.status { margin-top: 8px; font-size: 13px; color: var(--ok); min-height: 18px; }
.status.err { color: #f87171; }
.hint { margin-top: 6px; font-size: 12px; color: var(--muted); }
#card-list { margin-top: 4px; }

/* спиннер/оверлей загрузки */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(11, 14, 23, 0.65);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--muted);
  font-size: 15px;
  text-align: center;
}
.overlay:not([hidden]) { display: flex; flex-direction: column; }
.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255, 255, 255, 0.18);
  border-top-color: #e5485f;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

button:focus-visible, a:focus-visible {
  outline: 2px solid rgba(229, 72, 95, 0.9);
  outline-offset: 2px;
}
</style>
</head>
<body>
<div id="screen-tickets">
<h1>Админка</h1>
<p class="sub">Выберите билет</p>

<div class="section-title">Билет</div>
<div class="ticket-grid" id="ticket-grid"></div>
</div>

<div id="screen-ticket" hidden>
<div id="card-list"></div>
<div class="quiz-bar">
  <div class="quiz-bar-top">
  <button id="btn-back" class="btn-back" aria-label="Назад">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h2 class="ticket-bar-title" id="ticket-title"></h2>
  </div>
</div>
</div>

<div id="loading-overlay" class="overlay" hidden>
  <div class="spinner"></div>
  <span>Загрузка…</span>
</div>

<script>
const API = "https://functions.yandexcloud.net/d4edbj3nk4e2tporn3qk";

function tgFullscreen() {
  try {
    if (!window.Telegram || !Telegram.WebApp) return;
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.setHeaderColor("#0b0e17");
    Telegram.WebApp.setBackgroundColor("#0b0e17");
    if (Telegram.WebApp.disableVerticalSwipes) Telegram.WebApp.disableVerticalSwipes();
    if (Telegram.WebApp.requestFullscreen) Telegram.WebApp.requestFullscreen();
  } catch (e) {}
}
document.addEventListener("pointerdown", tgFullscreen, { once: true });

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => [...document.querySelectorAll(sel)];

let ticket = null;
let questions = [];

function showScreen(name) {
  $("#screen-tickets").hidden = name !== "tickets";
  $("#screen-ticket").hidden = name !== "ticket";
}

function showLoading(show, msg) {
  const overlay = $("#loading-overlay");
  overlay.hidden = !show;
  if (msg) overlay.querySelector("span").textContent = msg;
}

function ticketsRow(stats) {
  const wrap = $("#ticket-grid");
  wrap.innerHTML = "";
  for (let i = 1; i <= 40; i++) {
    const b = document.createElement("button");
    b.className = "ticket-btn";
    b.addEventListener("click", () => loadTicket(i));

    const num = document.createElement("span");
    num.className = "ticket-num";
    num.textContent = i;
    b.append(num);

    const c = stats[i] || {};
    if (c.comments > 0) {
      const cnt = document.createElement("span");
      cnt.className = "ticket-count";
      cnt.textContent =
        c.comments + " с комментарием" +
        (c.videos > 0 ? ` (${c.videos} с видео)` : "");
      b.append(cnt);
    }
    wrap.appendChild(b);
  }
}

async function loadTicket(num) {
  $$("#ticket-grid .ticket-btn").forEach((b) =>
    b.classList.toggle("active", Number(b.querySelector(".ticket-num").textContent) === num));
  $("#ticket-title").textContent = "Билет " + num;
  const list = $("#card-list");
  list.innerHTML = '<p class="sub">Загрузка…</p>';
  showScreen("ticket");
  showLoading(true, "Загрузка билета " + num + "…");
  try {
    const r = await fetch(`${API}?ticket=${num}`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "Ошибка");
    ticket = num;
    questions = d.questions;
    renderCards();
  } catch (e) {
    list.innerHTML = `<p class="sub" style="color:#f87171">Не удалось загрузить билет: ${e.message}</p>`;
  } finally {
    showLoading(false);
  }
}

$("#btn-back").addEventListener("click", () => showScreen("tickets"));

function dataUri(base64) {
  let mime = "image/jpeg";
  if (base64.startsWith("UklGR")) mime = "image/webp";
  else if (base64.startsWith("iVBOR")) mime = "image/png";
  else if (base64.startsWith("R0lG")) mime = "image/gif";
  return `data:${mime};base64,${base64}`;
}

function cleanLinks(text) {
  return (text || "").replace(/(https?:\/\/[^\s|]+)\s*\|\s*[^\n]*/gi, "$1");
}

function answersHtml(q) {
  const wrap = document.createElement("div");
  wrap.className = "answers";
  q.data.a.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "ans " + (i === q.data.correct ? "ans-correct" : "ans-wrong");
    d.textContent = `${i + 1}. ${t}`;
    const mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = i === q.data.correct ? "✓" : "✗";
    d.appendChild(mark);
    wrap.appendChild(d);
  });
  return wrap;
}

function renderCards() {
  const list = $("#card-list");
  list.innerHTML = "";
  questions.forEach((q) => {
    const card = document.createElement("div");
    card.className = "card" + (q.comment ? " has-c" : "");

    const head = document.createElement("div");
    head.className = "card-head";
    head.textContent = "Вопрос " + q.n;
    card.appendChild(head);

    const img = document.createElement("img");
    img.className = "card-img" + (q.image ? "" : " hidden");
    if (q.image) img.src = dataUri(q.image);
    card.appendChild(img);

    const qt = document.createElement("div");
    qt.className = "q-text";
    qt.textContent = q.data.q;
    card.appendChild(qt);

    const ans = answersHtml(q);
    card.appendChild(ans);

    const addBtn = document.createElement("button");
    addBtn.className = "add-comment";
    addBtn.hidden = !!q.comment;
    addBtn.textContent = "Добавить комментарий";
    addBtn.addEventListener("click", () => {
      addBtn.hidden = true;
      editor.hidden = false;
      ta.focus();
    });
    card.appendChild(addBtn);

    const ta = document.createElement("textarea");
    ta.placeholder = "Текст комментария…";
    ta.value = cleanLinks(q.comment);

    const save = document.createElement("button");
    save.className = "save";
    save.textContent = "Сохранить";
    save.addEventListener("click", () => saveComment(q, ta, save, card));

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "Удалить комментарий";
    del.addEventListener("click", () => deleteComment(q, ta, del, card));

    const st = document.createElement("div");
    st.className = "status";

    const editor = document.createElement("div");
    editor.className = "editor";
    editor.hidden = !q.comment;
    editor.append(ta, save, del, st);
    card.appendChild(editor);

    list.appendChild(card);
  });
  window.scrollTo(0, 0);
}

async function saveComment(q, ta, btn, card) {
  const value = cleanLinks(ta.value);
  ta.value = value;
  btn.disabled = true;
  const st = card.querySelector(".status");
  st.textContent = "";
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticket: ticket, n: q.n, comment: value }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error((d && d.error) || "HTTP " + r.status);
    q.comment = value;
    updateCard(card, q);
    st.textContent = "Сохранено";
    if (window.sendCommentReport) window.sendCommentReport(ticket, q.n, value);
  } catch (e) {
    st.textContent = "Ошибка: " + e.message;
    st.classList.add("err");
  } finally {
    btn.disabled = false;
  }
}

async function deleteComment(q, ta, btn, card) {
  if (!confirm("Удалить комментарий к вопросу " + q.n + "?")) return;
  btn.disabled = true;
  const st = card.querySelector(".status");
  st.textContent = "";
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticket: ticket, n: q.n, comment: "" }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error((d && d.error) || "HTTP " + r.status);
    q.comment = "";
    ta.value = "";
    updateCard(card, q);
    st.textContent = "Комментарий удалён";
  } catch (e) {
    st.textContent = "Ошибка: " + e.message;
    st.classList.add("err");
  } finally {
    btn.disabled = false;
  }
}

function updateCard(card, q) {
  card.classList.toggle("has-c", !!q.comment);
  const editor = card.querySelector(".editor");
  const addBtn = card.querySelector(".add-comment");
  if (q.comment) {
    editor.hidden = false;
    addBtn.hidden = true;
  } else {
    editor.hidden = true;
    addBtn.hidden = false;
  }
}

async function init() {
  tgFullscreen();
  if (window.reportAdminLaunch) window.reportAdminLaunch();
  showLoading(true, "Загрузка…");
  let stats = {};
  try {
    const r = await fetch(API);
    const d = await r.json();
    if (d.ok) {
      (d.stats || []).forEach((s) => {
        stats[s.ticket] = { comments: s.comments, videos: s.videos || 0 };
      });
    }
  } catch (e) {
    $("#screen-tickets .sub").textContent = "Ошибка загрузки: " + e.message;
  }
  ticketsRow(stats);
  showLoading(false);
}

init();
</script>
</body>
</html>
