<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Билеты ПДД 2026</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="report.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="screen-tickets" class="screen">
    <h1 class="title">Билеты ПДД 2026</h1>
    <p class="subtitle">Категория B · экзаменационные билеты</p>
    <p class="subtitle" id="loading-note">Загрузка…</p>
    <div class="ticket-grid" id="ticket-grid"></div>
  </section>

<section id="screen-quiz" class="screen hidden">
    <div id="quiz-list"></div>
    <div class="quiz-bar">
      <div class="quiz-bar-top">
        <button id="btn-back" class="icon-btn" aria-label="Назад">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="quiz-bar-stats">
          <span class="stat stat-ticket" id="quiz-ticket"></span>
          <span class="stat" id="quiz-answered"></span>
          <span class="stat stat-ok" id="quiz-correct"></span>
          <span class="stat stat-bad" id="quiz-wrong"></span>
        </div>
      </div>
      <div class="progress"><div id="quiz-progress" class="progress-fill"></div></div>
    </div>
    <footer class="quiz-footer">
      <button id="btn-result" class="primary">Показать результат</button>
    </footer>
  </section>

  <section id="screen-result" class="screen hidden">
    <div id="result-card" class="result-card"></div>
  </section>

  <div id="loading-overlay" class="overlay" hidden>
    <div class="spinner"></div>
    <span>Загрузка…</span>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
